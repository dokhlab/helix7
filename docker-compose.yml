services:
  mongo:
    image: mongo:7
    container_name: helix7-mongo
    restart: unless-stopped
    ports:
      # Host 27018 to avoid clashing with a native mongod on 27017.
      - "27018:27017"
    volumes:
      - helix7-mongo-data:/data/db
    command: ["--wiredTigerCacheSizeGB", "1"]

volumes:
  helix7-mongo-data:
