<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Helix7 mark: a top-down view of the seven-transmembrane helix bundle
       that defines every GPCR. Seven helices ringed around a central pocket. -->
  <defs>
    <radialGradient id="h7bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0c1622"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>
    <linearGradient id="h7ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#h7bg)"/>
  <!-- seven transmembrane helices arranged in the canonical GPCR ring -->
  <g>
    <!-- generated at angles 0..6 * (360/7), radius 17 around center (32,31) -->
    <circle cx="32" cy="14" r="5.4" fill="url(#h7ring)"/>
    <circle cx="45.3" cy="19.6" r="5.4" fill="url(#h7ring)" opacity="0.92"/>
    <circle cx="48.6" cy="33.7" r="5.4" fill="url(#h7ring)" opacity="0.85"/>
    <circle cx="39.6" cy="45.0" r="5.4" fill="url(#h7ring)" opacity="0.78"/>
    <circle cx="24.4" cy="45.0" r="5.4" fill="url(#h7ring)" opacity="0.78"/>
    <circle cx="15.4" cy="33.7" r="5.4" fill="url(#h7ring)" opacity="0.85"/>
    <circle cx="18.7" cy="19.6" r="5.4" fill="url(#h7ring)" opacity="0.92"/>
  </g>
  <!-- central ligand-binding pocket -->
  <circle cx="32" cy="31" r="6.2" fill="none" stroke="#a78bfa" stroke-width="2.2"/>
  <circle cx="32" cy="31" r="1.8" fill="#a78bfa"/>
</svg>
