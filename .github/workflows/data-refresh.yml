name: Helix7 data refresh

# Refreshes the atlas from its upstream sources into a hosted MongoDB.
# Use this when the app is deployed (e.g. Vercel + MongoDB Atlas) rather than
# on a self-managed server. Set a MONGODB_URI repository secret first.

on:
  schedule:
    # 03:30 UTC on the 1st of every month
    - cron: "30 3 1 * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

concurrency:
  group: helix7-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ETL dependencies
        working-directory: App/etl
        run: |
          python -m pip install --upgrade pip
          pip install httpx pymongo tenacity

      - name: Run refresh
        working-directory: App/etl
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: helix7
        run: python update.py

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-log
          path: App/etl/out/*.json
          if-no-files-found: ignore
